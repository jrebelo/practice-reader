[package]
name = "library_backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.7"
clap = { version = "4.5.53", features = ["derive"] }
hyphenation = { version = "0.8.4", features = ["embed_all"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
textwrap = { version = "0.16.2", default-features = false }
tokio = { version = "1.48.0", features = ["full"] }
tower-http = { version = "0.6.7", default-features = false, features = [
    "cors",
] }
